name: Weekly blog post (Sunday 07:00 IST)

on:
  schedule:
    - cron: "30 1 * * 0"   # 01:30 UTC Sunday = 07:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write this Sunday's post (needs ANTHROPIC_API_KEY secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/weekly-post.mjs
      - name: Rebuild blog index and commit
        run: |
          node scripts/sync.mjs
          git config user.name "bms-sync-bot"
          git config user.email "bms-sync-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Weekly blog $(TZ=Asia/Kolkata date +%F)"; git push; fi
