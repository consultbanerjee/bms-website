<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Write a Blog | Bharatiya Mazdoor Sangh</title>
<meta name="description" content="Write a blog post for Bharatiya Mazdoor Sangh">
<meta name="theme-color" content="#7A1F0B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/css/style.css">
</head><body data-page="write">
<a class="skip" href="#main">Skip to content</a>
<div id="hdr"></div>
<div class="pagehead"><div class="wrap"><div class="crumb"><a href="index.html">Home</a> / Write a Blog</div><h1>Write a Blog</h1><p>Admin: write a post, add photos, and publish it to the Blog.</p></div></div><main id="main" class="wrap" style="padding:30px 18px 60px"><div id="wgate"></div><div id="wbox" hidden><form id="wf" class="wform" onsubmit="return false">
<div class="grid g2"><label>Title<input name="title" required></label><label>Author<input name="author" placeholder="Editorial Desk"></label>
<label>Date<input name="date" type="date"></label><label>Release time (optional, IST, e.g. 07:00)<input name="time" type="time"></label>
<label>Category<input name="category" placeholder="e.g. Labour Law, Field Report"></label>
<label>Language<select name="lang"><option value="en">English</option><option value="hi">हिन्दी</option><option value="bn">বাংলা</option><option value="mr">मराठी</option><option value="other">Other</option></select></label>
<label>Cover image (path or URL; or upload below)<input name="cover"></label>
<label>URL name (optional, letters-digits-hyphens)<input name="slug"></label></div>
<label>Short summary<input name="summary" maxlength="220"></label>
<div class="grid g2"><label>Upload cover photo<input id="wcf" type="file" accept="image/*"></label><label>Insert a photo in the article<input id="wif" type="file" accept="image/*"></label></div>
<label>Article (simple formatting: # heading, **bold**, *italic*, - list, [link](https://…), ![caption](photo))<textarea name="body" rows="14"></textarea></label>
<label class="chk"><input type="checkbox" name="fb"> Also share this post on the BMS Facebook page when published</label>
<label>GitHub token (kept only in this browser)<input id="wt" type="password" autocomplete="off" placeholder="github_pat_… with Contents read/write on this repository"></label></form>
<p><button class="btn" id="wpub" type="button">Publish to Blog</button> <button class="btn sm ghost dk" id="wc" type="button">Copy file</button> <button class="btn sm ghost dk" id="wd" type="button">Download .json</button> <span id="wmsg" class="note"></span></p>
<div class="grid g2" style="margin-top:20px"><div class="box"><h3>Preview</h3><div class="md" id="wp"></div></div><div class="box"><h3>Post file</h3><pre id="wj" class="wj"></pre></div></div></div></main>
<div id="ftr"></div><div id="gt"></div>
<script src="assets/js/app.js" defer></script>
</body></html>
